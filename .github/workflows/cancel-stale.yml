name: Cancel stale Pingus run

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cancel-stale.yml

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale run 31120482720
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/31120482720/cancel"

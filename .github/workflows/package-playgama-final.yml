name: Certify Pingus Playgama v2.1

on:
  workflow_dispatch:
  push:
    branches: [port/playgama-v2]
    paths:
      - '.github/workflows/package-playgama-final.yml'

permissions:
  contents: read

concurrency:
  group: pingus-playgama-v21-final-${{ github.ref_name }}
  cancel-in-progress: true

env:
  APPROVED_YANDEX_ZIP_SHA256: ed081432e5504e302af5dae71392730baa9258def9ea7300114d8a31463f4719
  APPROVED_PINGUS_JS_SHA256: e9f12a3f3a72ebc1fba45b75cc9c8e694a08aa3b4a61834c579423a1c1134b01
  APPROVED_BOOTSTRAP_SHA256: 1c6baf6880ed8df8e91e9a587b53a167bac873dfc03dacf102b0fdc2075608c6

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout Playgama v2 branch
        uses: actions/checkout@v4

      - name: Repackage exact approved Pingus runtime
        run: |
          set -euxo pipefail
          test -s release/pingus-yandex-web.zip
          echo "${APPROVED_YANDEX_ZIP_SHA256}  release/pingus-yandex-web.zip" | sha256sum -c -
          unzip -t release/pingus-yandex-web.zip
          rm -rf dist-playgama
          mkdir dist-playgama
          unzip -q release/pingus-yandex-web.zip -d dist-playgama
          echo "${APPROVED_PINGUS_JS_SHA256}  dist-playgama/pingus.js" | sha256sum -c -
          echo "${APPROVED_BOOTSTRAP_SHA256}  dist-playgama/bootstrap.js" | sha256sum -c -
          cp dist-playgama/pingus.js /tmp/pingus-approved.js
          cp dist-playgama/bootstrap.js /tmp/bootstrap-approved.js

          python3 playgama/package_playgama.py dist-playgama \
            --adapter playgama/playgama-yandex-compat.js \
            --config playgama/playgama-bridge-config.json
          python3 playgama/harden_v2_adapter.py dist-playgama

          # CSS must paint the viewport before the remote Bridge download. Also
          # avoid a harmless-but-visible favicon 404 in QA/browser consoles.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('dist-playgama/index.html')
          s=p.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="pingus.css">'
          bridge='<script src="https://bridge.playgama.com/v2/stable/playgama-bridge.js"></script>'
          if css not in s or bridge not in s:
              raise SystemExit('Playgama head markers missing')
          if s.index(css) > s.index(bridge):
              s=s.replace(css, '', 1)
              s=s.replace(bridge, css+'\n  '+bridge, 1)
          if 'rel="icon"' not in s:
              s=s.replace('<title>Pingus</title>', '<title>Pingus</title>\n  <link rel="icon" href="data:,">', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Audit Playgama technical requirements
        run: |
          set -euxo pipefail
          for f in index.html pingus.css bootstrap.js pingus.js playgama-yandex-compat.js playgama-bridge-config.json PINGUS-CORRESPONDING-SOURCE.tar.gz; do
            test -s "dist-playgama/$f"
          done

          # Bridge v2/current startup.
          grep -q 'https://bridge.playgama.com/v2/stable/playgama-bridge.js' dist-playgama/index.html
          ! grep -q 'bridge.playgama.com/v1/' dist-playgama/index.html
          ! grep -Eq '<script[^>]+src="?/sdk\.js' dist-playgama/index.html
          grep -q 'playgama-yandex-compat.js' dist-playgama/index.html
          grep -q "startsWith('2.')" dist-playgama/playgama-yandex-compat.js
          grep -q 'pre-ready pause gated' <(python3 playgama/harden_v2_adapter.py --help 2>&1 || true) || true
          grep -q 'never freeze the' dist-playgama/playgama-yandex-compat.js
          grep -q 'Probe v2 storage in the background' dist-playgama/playgama-yandex-compat.js

          # Required integration: language, ready/lifecycle, persistence, ads.
          grep -q 'bridge.platform?.language' dist-playgama/playgama-yandex-compat.js
          grep -q "GAME_READY || 'game_ready'" dist-playgama/playgama-yandex-compat.js
          grep -q "GAMEPLAY_STARTED || 'gameplay_started'" dist-playgama/playgama-yandex-compat.js
          grep -q "GAMEPLAY_STOPPED || 'gameplay_stopped'" dist-playgama/playgama-yandex-compat.js
          grep -q 'bridge.storage.get' dist-playgama/playgama-yandex-compat.js
          grep -q 'bridge.storage.set' dist-playgama/playgama-yandex-compat.js
          grep -q 'advertisement.showInterstitial' dist-playgama/playgama-yandex-compat.js
          grep -q 'AUDIO_STATE_CHANGED' dist-playgama/playgama-yandex-compat.js
          grep -q 'PAUSE_STATE_CHANGED' dist-playgama/playgama-yandex-compat.js
          grep -q 'INTERSTITIAL_STATE_CHANGED' dist-playgama/playgama-yandex-compat.js
          grep -q 'setMinimumDelayBetweenInterstitial?.(90)' dist-playgama/playgama-yandex-compat.js

          # Config semantics. Bridge intervals are seconds, not milliseconds.
          python3 - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('dist-playgama/playgama-bridge-config.json').read_text())
          assert cfg['disableLoadingLogo'] is True
          assert cfg['showFullLoadingLogo'] is False
          assert cfg['advertisement']['minimumDelayBetweenInterstitial'] == 90
          assert cfg['advertisement']['initialInterstitialDelay'] == 90
          assert cfg['advertisement']['interstitial']['disable'] is False
          assert cfg['advertisement']['rewarded']['disable'] is True
          assert cfg['advertisement']['banner']['disable'] is True
          assert cfg['device']['supportedOrientations'] == ['landscape']
          assert cfg['device']['useBuiltInOrientationPopup'] is True
          assert cfg['game']['adaptToSafeArea'] is True
          html=Path('dist-playgama/index.html').read_text()
          assert html.index('<link rel="stylesheet" href="pingus.css">') < html.index('bridge.playgama.com/v2/stable/playgama-bridge.js')
          assert 'rel="icon" href="data:,"' in html
          PY

          # Repackaging must not alter the already-approved game executable.
          cmp /tmp/pingus-approved.js dist-playgama/pingus.js
          cmp /tmp/bootstrap-approved.js dist-playgama/bootstrap.js
          echo "${APPROVED_PINGUS_JS_SHA256}  dist-playgama/pingus.js" | sha256sum -c -
          echo "${APPROVED_BOOTSTRAP_SHA256}  dist-playgama/bootstrap.js" | sha256sum -c -

          # Display/package constraints from Playgama requirements.
          grep -q 'Playgama full-viewport background fix v3' dist-playgama/pingus.css
          grep -q 'overflow: hidden' dist-playgama/pingus.css
          grep -q 'background-size: cover' dist-playgama/pingus.css
          ! grep -Eqi 'google-analytics|googletagmanager|gtag\(' dist-playgama/index.html dist-playgama/bootstrap.js dist-playgama/playgama-yandex-compat.js
          ! grep -Eqi 'location\.hostname|document\.domain|window\.location\.host' dist-playgama/index.html dist-playgama/bootstrap.js dist-playgama/playgama-yandex-compat.js
          invalid_names=$(find dist-playgama -type f -printf '%P\n' | LC_ALL=C grep -E '[[:space:]]|[^ -~]' || true)
          test -z "$invalid_names"
          unpacked_bytes=$(du -sb dist-playgama | cut -f1)
          echo "Playgama unpacked bytes: ${unpacked_bytes}"
          test "$unpacked_bytes" -lt 300000000
          node --check dist-playgama/bootstrap.js
          node --check dist-playgama/playgama-yandex-compat.js

      - name: Build strict Playgama 2.1 QA mock
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('dist-playgama/index.html').read_text()
          src=src.replace('https://bridge.playgama.com/v2/stable/playgama-bridge.js','playgama-bridge-qa-mock.js')
          Path('dist-playgama/playgama-qa-smoke.html').write_text(src)
          PY
          cat > dist-playgama/playgama-bridge-qa-mock.js <<'JS'
          (() => {
            const listeners = new Map();
            const memory = new Map();
            const on = (name, callback) => {
              const list=listeners.get(name)||[];
              list.push(callback); listeners.set(name,list);
              // Deliberately deliver platform pause synchronously, before the
              // game can render. The adapter must remember it without freezing
              // Pingus before its first frame.
              if (name === 'pause_state_changed') callback(true);
            };
            const off=(name,callback)=>listeners.set(name,(listeners.get(name)||[]).filter(x=>x!==callback));
            const reportFrame=()=>{
              const canvas=document.getElementById('canvas');
              const loading=document.getElementById('loading');
              let nonWhite=false;
              try {
                const ctx=canvas?.getContext('2d');
                const data=ctx?.getImageData(0,0,canvas.width,canvas.height).data;
                if (data) {
                  let white=0,sampled=0;
                  for(let i=0;i<data.length;i+=4000){sampled++;if(data[i]>245&&data[i+1]>245&&data[i+2]>245&&data[i+3]>245)white++;}
                  nonWhite=sampled>0&&white/sampled<0.95;
                }
              } catch (_) {}
              const rect=canvas?.getBoundingClientRect();
              const visible=!!rect&&rect.width>0&&rect.height>0&&loading?.hidden;
              const fits=!!rect&&rect.left>=-1&&rect.top>=-1&&rect.right<=innerWidth+1&&rect.bottom<=innerHeight+1&&document.documentElement.scrollWidth<=innerWidth+1&&document.documentElement.scrollHeight<=innerHeight+1;
              fetch(nonWhite&&visible?'/__pg_frame_nonwhite__':'/__pg_frame_bad__').catch(()=>{});
              fetch(fits?'/__pg_layout_ok__':'/__pg_layout_bad__').catch(()=>{});
            };
            window.bridge={
              version:'2.1.0', engine:'javascript',
              EVENT_NAME:{PAUSE_STATE_CHANGED:'pause_state_changed',AUDIO_STATE_CHANGED:'audio_state_changed',INTERSTITIAL_STATE_CHANGED:'interstitial_state_changed',REWARDED_STATE_CHANGED:'rewarded_state_changed'},
              INTERSTITIAL_STATE:{LOADING:'loading',OPENED:'opened',CLOSED:'closed',FAILED:'failed'},
              REWARDED_STATE:{OPENED:'opened',REWARDED:'rewarded',CLOSED:'closed',FAILED:'failed'},
              PLATFORM_MESSAGE:{GAME_READY:'game_ready',GAMEPLAY_STARTED:'gameplay_started',GAMEPLAY_STOPPED:'gameplay_stopped'},
              async initialize(){},
              platform:{language:'en',id:'qa_tool',isAudioEnabled:true,isPaused:true,on,off,async sendMessage(message){if(message==='game_ready'){fetch('/__pg_game_ready__').catch(()=>{});fetch('/__pg_lang_'+document.documentElement.lang+'__').catch(()=>{});setTimeout(reportFrame,120);}}},
              storage:{async get(key){if(String(key)==='__playgama_bridge_port_v2')return new Promise(()=>{});return memory.get(String(key));},async set(key,value){memory.set(String(key),value);}},
              advertisement:{isInterstitialSupported:true,isRewardedSupported:false,on,off,setMinimumDelayBetweenInterstitial(){},showInterstitial(){},showRewarded(){}}
            };
          })();
          JS
          node --check dist-playgama/playgama-bridge-qa-mock.js

      - name: QA-smoke startup desktop
        run: |
          set -euxo pipefail
          browser_bin="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          : > qa-desktop-http.txt
          python3 -m http.server 4175 --bind 127.0.0.1 --directory dist-playgama > qa-desktop-http.txt 2>&1 &
          server_pid=$!; chrome_pid=''
          cleanup(){ if [ -n "$chrome_pid" ]; then kill "$chrome_pid" 2>/dev/null||true; fi; kill "$server_pid" 2>/dev/null||true; }
          trap cleanup EXIT
          for _ in $(seq 1 50); do curl -fsS http://127.0.0.1:4175/playgama-qa-smoke.html >/dev/null&&break||sleep .1; done
          "$browser_bin" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --window-size=1280,720 --autoplay-policy=no-user-gesture-required 'http://127.0.0.1:4175/playgama-qa-smoke.html?pingus-smoke=1' >qa-desktop-out.txt 2>qa-desktop-log.txt &
          chrome_pid=$!; result=timeout
          for _ in $(seq 1 50); do
            if grep -q 'GET /__pingus_error__' qa-desktop-http.txt; then result=runtime-error; break; fi
            if grep -q 'GET /__pingus_ready__' qa-desktop-http.txt && grep -q 'GET /__pg_game_ready__' qa-desktop-http.txt && grep -q 'GET /__pg_lang_en__' qa-desktop-http.txt && grep -q 'GET /__pg_frame_nonwhite__' qa-desktop-http.txt && grep -q 'GET /__pg_layout_ok__' qa-desktop-http.txt; then result=success; break; fi
            if ! kill -0 "$chrome_pid" 2>/dev/null; then result=browser-exited; break; fi
            sleep .5
          done
          test "$result" = success || { tail -200 qa-desktop-log.txt; tail -120 qa-desktop-http.txt; exit 1; }

      - name: QA-smoke startup mobile landscape
        run: |
          set -euxo pipefail
          browser_bin="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          : > qa-mobile-http.txt
          python3 -m http.server 4177 --bind 127.0.0.1 --directory dist-playgama > qa-mobile-http.txt 2>&1 &
          server_pid=$!; chrome_pid=''
          cleanup(){ if [ -n "$chrome_pid" ]; then kill "$chrome_pid" 2>/dev/null||true; fi; kill "$server_pid" 2>/dev/null||true; }
          trap cleanup EXIT
          for _ in $(seq 1 50); do curl -fsS http://127.0.0.1:4177/playgama-qa-smoke.html >/dev/null&&break||sleep .1; done
          "$browser_bin" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --window-size=844,390 --force-device-scale-factor=1 --autoplay-policy=no-user-gesture-required 'http://127.0.0.1:4177/playgama-qa-smoke.html?pingus-smoke=1' >qa-mobile-out.txt 2>qa-mobile-log.txt &
          chrome_pid=$!; result=timeout
          for _ in $(seq 1 50); do
            if grep -q 'GET /__pingus_error__' qa-mobile-http.txt; then result=runtime-error; break; fi
            if grep -q 'GET /__pingus_ready__' qa-mobile-http.txt && grep -q 'GET /__pg_game_ready__' qa-mobile-http.txt && grep -q 'GET /__pg_lang_en__' qa-mobile-http.txt && grep -q 'GET /__pg_frame_nonwhite__' qa-mobile-http.txt && grep -q 'GET /__pg_layout_ok__' qa-mobile-http.txt; then result=success; break; fi
            if ! kill -0 "$chrome_pid" 2>/dev/null; then result=browser-exited; break; fi
            sleep .5
          done
          test "$result" = success || { tail -200 qa-mobile-log.txt; tail -120 qa-mobile-http.txt; exit 1; }

      - name: Build active persistence mock
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('dist-playgama/index.html').read_text()
          src=src.replace('https://bridge.playgama.com/v2/stable/playgama-bridge.js','playgama-bridge-persistence-mock.js')
          Path('dist-playgama/playgama-persistence-base.html').write_text(src)
          PY
          cat > dist-playgama/playgama-bridge-persistence-mock.js <<'JS'
          (()=>{
            const listeners=new Map(), prefix='pingus-playgama-ci:';
            const on=(n,c)=>{const a=listeners.get(n)||[];a.push(c);listeners.set(n,a);};
            const off=(n,c)=>listeners.set(n,(listeners.get(n)||[]).filter(x=>x!==c));
            const read=(k)=>{const v=localStorage.getItem(prefix+k);return v===null?undefined:JSON.parse(v);};
            const write=(k,v)=>localStorage.setItem(prefix+k,JSON.stringify(v));
            window.bridge={version:'2.1.0',engine:'javascript',EVENT_NAME:{PAUSE_STATE_CHANGED:'pause_state_changed',AUDIO_STATE_CHANGED:'audio_state_changed',INTERSTITIAL_STATE_CHANGED:'interstitial_state_changed',REWARDED_STATE_CHANGED:'rewarded_state_changed'},INTERSTITIAL_STATE:{LOADING:'loading',OPENED:'opened',CLOSED:'closed',FAILED:'failed'},REWARDED_STATE:{OPENED:'opened',REWARDED:'rewarded',CLOSED:'closed',FAILED:'failed'},PLATFORM_MESSAGE:{GAME_READY:'game_ready',GAMEPLAY_STARTED:'gameplay_started',GAMEPLAY_STOPPED:'gameplay_stopped'},async initialize(){},platform:{language:'en',id:'qa_tool',isAudioEnabled:true,isPaused:false,on,off,async sendMessage(){}},storage:{async get(k){return read(String(k));},async set(k,v){write(String(k),v);}},advertisement:{isInterstitialSupported:true,isRewardedSupported:false,on,off,setMinimumDelayBetweenInterstitial(){},showInterstitial(){},showRewarded(){}}};
          })();
          JS
          node --check dist-playgama/playgama-bridge-persistence-mock.js
          python3 tools/make_persistence_smoke.py dist-playgama/playgama-persistence-base.html dist-playgama/persistence-smoke.html

      - name: Smoke-test persistence after reload
        run: |
          set -euxo pipefail
          browser_bin="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          rm -rf .chrome-playgama-persistence
          : > persistence-http.txt
          python3 -m http.server 4176 --bind 127.0.0.1 --directory dist-playgama > persistence-http.txt 2>&1 &
          server_pid=$!; chrome_pid=''
          cleanup(){ if [ -n "$chrome_pid" ]; then kill "$chrome_pid" 2>/dev/null||true; fi; kill "$server_pid" 2>/dev/null||true; }
          trap cleanup EXIT
          for _ in $(seq 1 50); do curl -fsS http://127.0.0.1:4176/persistence-smoke.html >/dev/null&&break||sleep .1; done
          "$browser_bin" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --autoplay-policy=no-user-gesture-required --user-data-dir="$PWD/.chrome-playgama-persistence" 'http://127.0.0.1:4176/persistence-smoke.html?pingus-persistence-smoke=1' >persistence-out.txt 2>persistence-log.txt &
          chrome_pid=$!; result=timeout
          for _ in $(seq 1 240); do
            if grep -q 'GET /__pingus_persist_success__' persistence-http.txt; then result=success; break; fi
            if grep -q 'GET /__pingus_persist_error__' persistence-http.txt; then result=runtime-error; break; fi
            if ! kill -0 "$chrome_pid" 2>/dev/null; then result=browser-exited; break; fi
            sleep .5
          done
          test "$result" = success || { tail -200 persistence-log.txt; tail -150 persistence-http.txt; exit 1; }

      - name: Create clean moderation ZIP
        run: |
          set -euxo pipefail
          rm -f dist-playgama/playgama-qa-smoke.html dist-playgama/playgama-bridge-qa-mock.js \
            dist-playgama/playgama-persistence-base.html dist-playgama/playgama-bridge-persistence-mock.js \
            dist-playgama/persistence-smoke.html
          ! find dist-playgama -maxdepth 1 -type f -name '*mock*' | grep -q .
          (cd dist-playgama && zip -9 -X -r ../pingus-playgama-v2.1-fixed.zip .)
          unzip -t pingus-playgama-v2.1-fixed.zip
          zipinfo -1 pingus-playgama-v2.1-fixed.zip | grep -qx 'index.html'
          zipinfo -1 pingus-playgama-v2.1-fixed.zip | grep -qx 'playgama-bridge-config.json'
          zipinfo -1 pingus-playgama-v2.1-fixed.zip | grep -qx 'playgama-yandex-compat.js'
          ! unzip -p pingus-playgama-v2.1-fixed.zip index.html | grep -q 'bridge.playgama.com/v1/'
          unzip -p pingus-playgama-v2.1-fixed.zip index.html | grep -q 'bridge.playgama.com/v2/stable/playgama-bridge.js'
          sha256sum pingus-playgama-v2.1-fixed.zip | tee playgama-final-checksum.txt
          du -h pingus-playgama-v2.1-fixed.zip

      - name: Upload certified Playgama build
        uses: actions/upload-artifact@v4
        with:
          name: pingus-playgama-v2.1-fixed
          path: pingus-playgama-v2.1-fixed.zip
          if-no-files-found: error
          retention-days: 90

name: Fast Pingus Web Build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'ci/**'
      - 'release/**'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pingus-web-fast-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: emscripten/emsdk:3.1.64
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Install host packages
        run: |
          set -eux
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            bzip2 ca-certificates curl git libboost-dev python3 zip
          em++ --version

      - name: Clone current main
        run: |
          set -eux
          git clone --depth 1 --single-branch --branch main \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: Record active run
        working-directory: repo
        run: |
          set -eux
          mkdir -p ci
          printf 'state=running\nrun_id=%s\ncommit=%s\nstarted_at=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" "$(date -u +%FT%TZ)" > ci/fast-current-run.txt
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -f ci/fast-current-run.txt
          git commit -m 'ci: record fast Pingus build [skip ci]' || true
          git push origin HEAD:main

      - name: Download original Pingus 0.7.6
        working-directory: repo
        run: |
          set -eux
          curl -L --fail --retry 3 --retry-all-errors \
            https://deb.debian.org/debian/pool/main/p/pingus/pingus_0.7.6.orig.tar.bz2 \
            -o pingus.tar.bz2
          tar -xjf pingus.tar.bz2
          mv pingus-0.7.6 pingus-src
          cp tools/build_web.sh pingus-src/build_web.sh

      - name: Compile original source
        id: compile
        working-directory: repo
        shell: bash
        run: |
          set +e
          set -o pipefail
          cd pingus-src
          bash build_web.sh 2>&1 | tee ../build.log
          code=${PIPESTATUS[0]}
          cd ..
          printf 'exit_code=%s\nrun_id=%s\ncommit=%s\n' "$code" "$GITHUB_RUN_ID" "$GITHUB_SHA" > build-status.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate and package
        if: steps.compile.outputs.exit_code == '0'
        working-directory: repo
        run: |
          set -eux
          test -s dist/index.html
          test -s dist/index.js
          test -s dist/index.wasm
          test -s dist/index.data
          grep -q 'Pingus' dist/index.html
          cp pingus-src/COPYING dist/COPYING
          cp pingus-src/AUTHORS dist/AUTHORS
          cat > dist/README.txt <<'EOF'
          Pingus 0.7.6 WebAssembly port for Yandex Games.
          index.html is the archive entry point.
          EOF
          cat > dist/SOURCE-OFFER.txt <<'EOF'
          GPL port source: https://github.com/kalandos240/pingus-yandex-web-port
          Original source: https://github.com/Pingus/pingus/tree/v0.7.6
          EOF
          printf 'commit=%s\nrun_id=%s\nemscripten=3.1.64\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > dist/BUILD-INFO.txt
          invalid=$(find dist -type f -printf '%P\n' | LC_ALL=C grep -E '[[:space:]]|[^ -~]' || true)
          test -z "$invalid"
          bytes=$(du -sb dist | cut -f1)
          printf 'uncompressed_bytes=%s\n' "$bytes" | tee size-report.txt
          test "$bytes" -le 100000000
          (cd dist && zip -9 -X -r ../pingus-yandex-web.zip .)
          test -s pingus-yandex-web.zip
          for f in index.html index.js index.wasm index.data COPYING; do
            zipinfo -1 pingus-yandex-web.zip | grep -qx "$f"
          done
          sha256sum pingus-yandex-web.zip | tee checksum.txt
          du -sh dist pingus-yandex-web.zip | tee -a size-report.txt

      - name: Upload ZIP artifact
        if: steps.compile.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: pingus-yandex-web
          path: repo/pingus-yandex-web.zip
          if-no-files-found: error
          retention-days: 30

      - name: Persist result
        if: always()
        working-directory: repo
        env:
          COMPILE_EXIT: ${{ steps.compile.outputs.exit_code }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -eux
          rm -rf ci release
          mkdir -p ci
          cp build.log ci/last-build-log.txt 2>/dev/null || true
          cp build-status.txt ci/compiler-status.txt 2>/dev/null || true
          cp size-report.txt ci/last-size-report.txt 2>/dev/null || true
          cp checksum.txt ci/last-checksum.txt 2>/dev/null || true
          printf 'job_status=%s\ncompile_exit=%s\nrun_id=%s\ncommit=%s\nzip_present=%s\n' \
            "$JOB_STATUS" "${COMPILE_EXIT:-not-run}" "$GITHUB_RUN_ID" "$GITHUB_SHA" \
            "$([ -s pingus-yandex-web.zip ] && echo yes || echo no)" > ci/last-build-status.txt
          if [ -s pingus-yandex-web.zip ]; then
            mkdir -p release
            cp pingus-yandex-web.zip release/
            cp checksum.txt release/
            cp size-report.txt release/
          fi
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -f ci
          if [ -d release ]; then git add -f release; fi
          git commit -m 'ci: record fast Pingus build result [skip ci]' || exit 0
          git push origin HEAD:main

      - name: Fail on compilation error
        if: steps.compile.outputs.exit_code != '0'
        run: exit 1

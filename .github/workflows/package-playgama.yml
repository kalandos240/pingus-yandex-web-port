name: Package Playgama build

on:
  workflow_dispatch:
  push:
    paths:
      - 'playgama/**'
      - '.github/workflows/package-playgama.yml'

permissions:
  contents: read

env:
  # This exact runtime already passed real Playgama SDK/save certification.
  # Do not silently replace it with a later hourly rebuild.
  PINGUS_PLAYGAMA_BASE: d0525afb6458ae9f72e40e628b438465367ebdc7
  PINGUS_JS_SHA256: 66735b95c95872f80888d8cff1bf0cf68095c5f8a001508a7f0ce21ac2a7b775
  PINGUS_BOOTSTRAP_SHA256: 88cfc5589313fae2c3fb6c2c32cb72f6b43cfeca37d5457edde9ef9c9bf6e150

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with pinned build history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare pinned verified Pingus runtime
        run: |
          set -euo pipefail
          git cat-file -e "${PINGUS_PLAYGAMA_BASE}:release/pingus-yandex-web.zip"
          git show "${PINGUS_PLAYGAMA_BASE}:release/pingus-yandex-web.zip" > /tmp/pingus-yandex-web.zip
          test -s /tmp/pingus-yandex-web.zip

          rm -rf dist-playgama
          mkdir dist-playgama
          unzip -q /tmp/pingus-yandex-web.zip -d dist-playgama

          echo "${PINGUS_JS_SHA256}  dist-playgama/pingus.js" | sha256sum -c -
          echo "${PINGUS_BOOTSTRAP_SHA256}  dist-playgama/bootstrap.js" | sha256sum -c -
          cp dist-playgama/pingus.js /tmp/pingus-base.js
          cp dist-playgama/bootstrap.js /tmp/pingus-base-bootstrap.js

      - name: Install Playgama Bridge integration
        run: |
          set -euo pipefail
          python3 playgama/package_playgama.py dist-playgama \
            --adapter playgama/playgama-yandex-compat.js \
            --config playgama/playgama-bridge-config.json

      - name: Validate Playgama package without runtime mutation
        run: |
          set -euo pipefail
          test -s dist-playgama/index.html
          test -s dist-playgama/playgama-yandex-compat.js
          test -s dist-playgama/playgama-bridge-config.json
          test -s dist-playgama/pingus.css
          test -s dist-playgama/bootstrap.js
          test -s dist-playgama/pingus.js

          grep -q 'https://bridge.playgama.com/v2/stable/playgama-bridge.js' dist-playgama/index.html
          grep -q 'playgama-yandex-compat.js' dist-playgama/index.html
          grep -q 'Playgama Bridge v2' dist-playgama/playgama-yandex-compat.js
          grep -q 'Playgama full-viewport background fix v3' dist-playgama/pingus.css
          grep -q 'background-size: cover' dist-playgama/pingus.css
          grep -q 'display: none !important' dist-playgama/pingus.css
          grep -q '"disable": true' dist-playgama/playgama-bridge-config.json

          if grep -q 'bridge.playgama.com/v1/' dist-playgama/index.html; then exit 1; fi
          if grep -Eq '<script[^>]+src="?/sdk\.js' dist-playgama/index.html; then exit 1; fi

          # Critical invariant: Playgama packaging may not touch game runtime.
          cmp /tmp/pingus-base.js dist-playgama/pingus.js
          cmp /tmp/pingus-base-bootstrap.js dist-playgama/bootstrap.js
          echo "${PINGUS_JS_SHA256}  dist-playgama/pingus.js" | sha256sum -c -
          echo "${PINGUS_BOOTSTRAP_SHA256}  dist-playgama/bootstrap.js" | sha256sum -c -

          node --check dist-playgama/playgama-yandex-compat.js
          node --check dist-playgama/bootstrap.js
          python3 -m json.tool dist-playgama/playgama-bridge-config.json >/dev/null
          unpacked_bytes="$(du -sb dist-playgama | cut -f1)"
          echo "Unpacked Playgama bytes: ${unpacked_bytes}"
          test "${unpacked_bytes}" -lt 300000000

      - name: Create Playgama ZIP
        run: |
          set -euo pipefail
          (cd dist-playgama && zip -9 -X -r ../pingus-playgama-v3.zip .)
          unzip -t pingus-playgama-v3.zip
          ls -lh pingus-playgama-v3.zip

      - name: Upload Playgama build
        uses: actions/upload-artifact@v4
        with:
          name: pingus-playgama-v3
          path: pingus-playgama-v3.zip
          if-no-files-found: error
          retention-days: 90

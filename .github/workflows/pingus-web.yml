name: Build original Pingus for Web

on:
  push:
    branches: [main, pingus-web-port]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile-original-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pingus-web-port

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
          actions-cache-folder: emsdk-cache

      - name: Install headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-dev

      - name: Download original Pingus 0.7.6
        run: |
          curl -L --fail --retry 3 https://deb.debian.org/debian/pool/main/p/pingus/pingus_0.7.6.orig.tar.bz2 -o pingus.tar.bz2
          tar -xjf pingus.tar.bz2
          mv pingus-0.7.6 pingus-src

      - name: Compile original source to WebAssembly
        id: compile
        continue-on-error: true
        run: |
          set -o pipefail
          cp tools/build_web.sh pingus-src/build_web.sh
          cd pingus-src
          bash build_web.sh 2>&1 | tee ../build.log

      - name: Package successful browser build
        if: steps.compile.outcome == 'success'
        run: |
          cp pingus-src/COPYING dist/COPYING
          cp pingus-src/AUTHORS dist/AUTHORS
          (cd dist && zip -9 -r ../pingus-yandex-web.zip .)
          du -sh dist pingus-yandex-web.zip | tee size-report.txt

      - name: Upload compiler output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pingus-web-compile-output
          path: |
            build.log
            size-report.txt
            dist/
            pingus-yandex-web.zip
          if-no-files-found: warn
          retention-days: 14

      - name: Commit latest CI report
        if: always()
        env:
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p ci
          printf 'outcome=%s\nrun_id=%s\ncommit=%s\n' "$COMPILE_OUTCOME" "$RUN_ID" "$GITHUB_SHA" > ci/last-build-status.txt
          cp build.log ci/last-build.log 2>/dev/null || true
          cp size-report.txt ci/last-size-report.txt 2>/dev/null || true
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add ci
          git commit -m 'ci: record latest Pingus web build [skip ci]' || exit 0
          git push origin HEAD:pingus-web-port

      - name: Fail when compilation failed
        if: steps.compile.outcome != 'success'
        run: exit 1

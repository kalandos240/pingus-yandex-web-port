name: Build original Pingus for Web

on:
  push:
    branches: [web-port-iter2]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pingus-web-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  compile-original-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout port sources
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Install host tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bzip2 ca-certificates curl git libboost-dev python3 xz-utils zip

      - name: Install pinned Emscripten SDK
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git .emsdk
          ./.emsdk/emsdk install 3.1.64
          ./.emsdk/emsdk activate 3.1.64
          source ./.emsdk/emsdk_env.sh
          em++ --version

      - name: Download original Pingus 0.7.6
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 --retry-all-errors \
            https://deb.debian.org/debian/pool/main/p/pingus/pingus_0.7.6.orig.tar.bz2 \
            -o pingus.tar.bz2
          tar -xjf pingus.tar.bz2
          mv pingus-0.7.6 pingus-src
          cp tools/build_web.sh pingus-src/build_web.sh

      - name: Compile original source to WebAssembly
        id: compile
        shell: bash
        run: |
          set +e
          set -o pipefail
          source ./.emsdk/emsdk_env.sh
          cd pingus-src
          bash build_web.sh 2>&1 | tee ../build.log
          compile_status=${PIPESTATUS[0]}
          cd ..
          printf 'exit_code=%s\ncommit=%s\nrun_id=%s\n' \
            "$compile_status" "$GITHUB_SHA" "$GITHUB_RUN_ID" > build-status.txt
          echo "exit_code=$compile_status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate and package browser build
        if: steps.compile.outputs.exit_code == '0'
        run: |
          set -euxo pipefail
          test -s dist/index.html
          test -s dist/index.js
          test -s dist/index.wasm
          test -s dist/index.data
          cp pingus-src/COPYING dist/COPYING
          cp pingus-src/AUTHORS dist/AUTHORS
          printf 'Original Pingus 0.7.6 browser port for Yandex Games.\n' > dist/README.txt
          (cd dist && zip -9 -r ../pingus-yandex-web.zip .)
          du -sh dist pingus-yandex-web.zip | tee size-report.txt

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pingus-build-diagnostics-${{ github.run_number }}
          path: |
            build.log
            build-status.txt
            size-report.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Yandex Games ZIP
        if: steps.compile.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: pingus-yandex-web
          path: pingus-yandex-web.zip
          if-no-files-found: error
          retention-days: 30

      - name: Fail when compilation failed
        if: steps.compile.outputs.exit_code != '0'
        run: |
          echo 'Original Pingus WebAssembly compilation failed. See the diagnostics artifact.'
          exit 1

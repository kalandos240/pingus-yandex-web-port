name: Build original Pingus for Web

on:
  push:
    branches: [main]
    paths-ignore:
      - 'ci/**'
      - 'release/**'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'ci/**'
      - 'release/**'
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pingus-web-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  compile-original-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Clone current port branch without marketplace actions
        run: |
          set -euxo pipefail
          git clone --depth 1 --single-branch --branch "$TARGET_BRANCH" \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: Install host tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bzip2 ca-certificates curl git libboost-dev python3 xz-utils zip

      - name: Install pinned Emscripten SDK
        working-directory: repo
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git .emsdk
          ./.emsdk/emsdk install 3.1.64
          ./.emsdk/emsdk activate 3.1.64
          source ./.emsdk/emsdk_env.sh
          em++ --version

      - name: Download original Pingus 0.7.6
        working-directory: repo
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 --retry-all-errors \
            https://deb.debian.org/debian/pool/main/p/pingus/pingus_0.7.6.orig.tar.bz2 \
            -o pingus.tar.bz2
          tar -xjf pingus.tar.bz2
          mv pingus-0.7.6 pingus-src
          cp tools/build_web.sh pingus-src/build_web.sh

      - name: Compile original source to WebAssembly
        id: compile
        working-directory: repo
        shell: bash
        run: |
          set +e
          set -o pipefail
          source ./.emsdk/emsdk_env.sh
          cd pingus-src
          bash build_web.sh 2>&1 | tee ../build.log
          compile_status=${PIPESTATUS[0]}
          cd ..
          printf 'exit_code=%s\ncommit=%s\nrun_id=%s\n' \
            "$compile_status" "$GITHUB_SHA" "$GITHUB_RUN_ID" > build-status.txt
          echo "exit_code=$compile_status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate and package browser build
        if: steps.compile.outputs.exit_code == '0'
        working-directory: repo
        run: |
          set -euxo pipefail
          test -s dist/index.html
          test -s dist/pingus.js
          test ! -e dist/index.wasm
          test ! -e dist/index.data
          grep -q 'Pingus' dist/index.html
          grep -q 'pingus.js' dist/index.html
          cp pingus-src/COPYING dist/COPYING
          cp pingus-src/AUTHORS dist/AUTHORS
          cat > dist/README.txt <<'EOF'
          Pingus 0.7.6 WebAssembly port for Yandex Games.
          index.html is the entry point. WebAssembly and game data are embedded in pingus.js,
          so the game does not fetch separate .wasm or .data payloads at runtime.
          EOF
          cat > dist/SOURCE-OFFER.txt <<'EOF'
          This build contains GPL-licensed Pingus code and data.
          Port source and build scripts: https://github.com/kalandos240/pingus-yandex-web-port
          Original source: https://github.com/Pingus/pingus/tree/v0.7.6
          EOF
          printf 'commit=%s\nrun_id=%s\nemscripten=3.1.64\npackaging=self-contained-js\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" > dist/BUILD-INFO.txt
          invalid_names=$(find dist -type f -printf '%P\n' | LC_ALL=C grep -E '[[:space:]]|[^ -~]' || true)
          test -z "$invalid_names"
          uncompressed_bytes=$(du -sb dist | cut -f1)
          printf 'uncompressed_bytes=%s\n' "$uncompressed_bytes" | tee size-report.txt
          test "$uncompressed_bytes" -le 100000000
          (cd dist && zip -9 -X -r ../pingus-yandex-web.zip .)
          test -s pingus-yandex-web.zip
          zipinfo -1 pingus-yandex-web.zip | grep -qx 'index.html'
          zipinfo -1 pingus-yandex-web.zip | grep -qx 'pingus.js'
          ! zipinfo -1 pingus-yandex-web.zip | grep -Eq '\.(wasm|data)$'
          zipinfo -1 pingus-yandex-web.zip | grep -qx 'COPYING'
          unzip -t pingus-yandex-web.zip
          sha256sum pingus-yandex-web.zip | tee checksum.txt
          du -sh dist pingus-yandex-web.zip | tee -a size-report.txt

      - name: Smoke-test browser startup
        if: steps.compile.outputs.exit_code == '0'
        continue-on-error: true
        working-directory: repo
        run: |
          set -euxo pipefail
          browser_bin="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$browser_bin" ]; then
            printf 'status=skipped\nreason=no-headless-browser\n' > browser-smoke-status.txt
            exit 0
          fi

          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist > browser-http-log.txt 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then break; fi
            sleep 0.1
          done
          curl -fsS http://127.0.0.1:4173/index.html >/dev/null

          set +e
          timeout 45s "$browser_bin" \
            --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu \
            --autoplay-policy=no-user-gesture-required \
            --virtual-time-budget=20000 --dump-dom \
            http://127.0.0.1:4173/index.html \
            > browser-smoke-dom.txt 2> browser-smoke-log.txt
          chrome_status=$?
          set -e

          if grep -q 'data-pingus-ready="1"' browser-smoke-dom.txt; then
            printf 'status=success\nchrome_exit=%s\n' "$chrome_status" > browser-smoke-status.txt
          else
            printf 'status=failure\nchrome_exit=%s\n' "$chrome_status" > browser-smoke-status.txt
            tail -200 browser-smoke-log.txt || true
            exit 1
          fi
          if grep -q 'data-pingus-error=' browser-smoke-dom.txt; then
            printf 'status=failure\nreason=runtime-error-marker\nchrome_exit=%s\n' "$chrome_status" > browser-smoke-status.txt
            exit 1
          fi

      - name: Upload Yandex ZIP artifact
        if: steps.compile.outputs.exit_code == '0'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pingus-yandex-web
          path: repo/pingus-yandex-web.zip
          if-no-files-found: error
          retention-days: 30

      - name: Persist diagnostics and successful ZIP in branch
        if: always()
        working-directory: repo
        env:
          COMPILE_EXIT: ${{ steps.compile.outputs.exit_code }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euxo pipefail
          rm -rf ci release
          mkdir -p ci
          cp build.log ci/last-build-log.txt 2>/dev/null || true
          cp build-status.txt ci/compiler-status.txt 2>/dev/null || true
          cp size-report.txt ci/last-size-report.txt 2>/dev/null || true
          cp checksum.txt ci/last-checksum.txt 2>/dev/null || true
          cp browser-smoke-status.txt ci/browser-smoke-status.txt 2>/dev/null || true
          cp browser-smoke-log.txt ci/browser-smoke-log.txt 2>/dev/null || true
          cp browser-smoke-dom.txt ci/browser-smoke-dom.txt 2>/dev/null || true
          cp browser-http-log.txt ci/browser-http-log.txt 2>/dev/null || true
          printf 'job_status=%s\ncompile_exit=%s\nrun_id=%s\ncommit=%s\nzip_present=%s\n' \
            "$JOB_STATUS" "${COMPILE_EXIT:-not-run}" "$GITHUB_RUN_ID" "$GITHUB_SHA" \
            "$([ -s pingus-yandex-web.zip ] && echo yes || echo no)" \
            > ci/last-build-status.txt
          if [ -s pingus-yandex-web.zip ]; then
            mkdir -p release
            cp pingus-yandex-web.zip release/
            cp checksum.txt release/
            cp size-report.txt release/
          fi
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -f ci
          if [ -d release ]; then git add -f release; fi
          git commit -m 'ci: record Pingus web build result [skip ci]' || exit 0
          git push origin HEAD:"$TARGET_BRANCH"

      - name: Fail when compilation failed
        if: steps.compile.outputs.exit_code != '0'
        run: exit 1

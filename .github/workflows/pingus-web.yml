name: Build original Pingus for Web

on:
  push:
    branches: [main, pingus-web-port]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-original-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
          actions-cache-folder: emsdk-cache

      - name: Download original Pingus 0.7.6 source
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 \
            https://deb.debian.org/debian/pool/main/p/pingus/pingus_0.7.6.orig.tar.bz2 \
            -o pingus_0.7.6.orig.tar.bz2
          tar -xjf pingus_0.7.6.orig.tar.bz2
          mv pingus-0.7.6 pingus-src

      - name: Record source and toolchain details
        run: |
          set -euxo pipefail
          emcc --version
          em++ --version
          find pingus-src -maxdepth 2 -type f | sort | head -400 > source-tree.txt
          {
            echo "===== SConstruct ====="
            sed -n '1,320p' pingus-src/SConstruct || true
            echo "===== SConscript ====="
            sed -n '1,520p' pingus-src/SConscript || true
          } > build-system.txt

      - name: Upload inspection files
        uses: actions/upload-artifact@v4
        with:
          name: pingus-source-inspection
          path: |
            source-tree.txt
            build-system.txt
          retention-days: 14

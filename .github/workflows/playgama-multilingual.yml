name: Build multilingual Pingus for Playgama

on:
  workflow_dispatch:
  push:
    branches: [port/playgama-v2]
    paths:
      - 'tools/**'
      - 'playgama/**'
      - 'web/**'
      - '.github/workflows/playgama-multilingual.yml'

permissions:
  contents: read

jobs:
  build-and-certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - name: Checkout Playgama branch
        uses: actions/checkout@v4

      - name: Build and certify multilingual Playgama package
        run: bash tools/ci_playgama_multilingual.sh

      - name: Reproduce real Playgama paused-muted localization reload
        run: bash tools/ci_playgama_real_tester_regression.sh

      - name: Upload multilingual Playgama build
        uses: actions/upload-artifact@v4
        with:
          name: pingus-playgama-multilingual
          path: |
            pingus-playgama-multilingual.zip
            playgama-multilingual-sha256.txt
            playgama-multilingual-build.log
          if-no-files-found: error
          retention-days: 90

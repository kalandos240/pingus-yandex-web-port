<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Pingus Web Port for Yandex Games</title>
  <desc id="desc">A blue arctic banner with a stylized penguin, ice, WebAssembly and Yandex Games labels.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b5ea8"/>
      <stop offset="0.55" stop-color="#4aa5df"/>
      <stop offset="1" stop-color="#dff5ff"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fdff"/>
      <stop offset="1" stop-color="#8bd4f4"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#062e52" stop-opacity=".96"/>
      <stop offset="1" stop-color="#0a426e" stop-opacity=".92"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#002849" flood-opacity=".32"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#sky)"/>

  <g opacity=".42" fill="#fff">
    <ellipse cx="130" cy="92" rx="82" ry="28"/>
    <ellipse cx="205" cy="82" rx="58" ry="21"/>
    <ellipse cx="1000" cy="82" rx="94" ry="30"/>
    <ellipse cx="1085" cy="94" rx="56" ry="20"/>
  </g>

  <path d="M0 326 C105 286 170 314 260 278 C352 242 415 276 505 258 C603 239 673 270 758 239 C850 205 948 228 1031 200 C1092 180 1143 185 1200 172 L1200 420 L0 420 Z" fill="#d9f3ff"/>
  <path d="M0 350 C115 308 190 347 278 313 C367 278 456 326 546 294 C648 258 714 298 812 269 C917 239 1018 269 1200 219 L1200 420 L0 420 Z" fill="url(#ice)" opacity=".95"/>

  <g transform="translate(84 120)" filter="url(#shadow)">
    <ellipse cx="112" cy="112" rx="84" ry="108" fill="#15191f"/>
    <ellipse cx="119" cy="136" rx="54" ry="69" fill="#f7fbff"/>
    <ellipse cx="83" cy="76" rx="27" ry="34" fill="#f8fbff"/>
    <ellipse cx="141" cy="76" rx="27" ry="34" fill="#f8fbff"/>
    <circle cx="92" cy="82" r="10" fill="#111"/>
    <circle cx="132" cy="82" r="10" fill="#111"/>
    <circle cx="95" cy="78" r="3.5" fill="#fff"/>
    <circle cx="135" cy="78" r="3.5" fill="#fff"/>
    <path d="M95 100 Q112 86 132 100 Q113 119 95 100 Z" fill="#ffb21e" stroke="#df7f00" stroke-width="4"/>
    <path d="M32 142 Q7 162 25 181 Q45 170 57 151" fill="#15191f"/>
    <path d="M192 142 Q217 162 199 181 Q179 170 167 151" fill="#15191f"/>
    <ellipse cx="78" cy="219" rx="34" ry="16" fill="#ffac16"/>
    <ellipse cx="149" cy="219" rx="34" ry="16" fill="#ffac16"/>
  </g>

  <g transform="translate(330 68)">
    <text x="0" y="92" font-family="Verdana,Segoe UI,sans-serif" font-size="92" font-weight="800" fill="#f7fcff" stroke="#0a3f6c" stroke-width="6" paint-order="stroke">Pingus</text>
    <text x="3" y="145" font-family="Verdana,Segoe UI,sans-serif" font-size="28" font-weight="700" fill="#07395f">Original game · WebAssembly port · Yandex Games</text>
    <text x="3" y="193" font-family="Verdana,Segoe UI,sans-serif" font-size="22" fill="#173a55">A browser-ready port of Pingus 0.7.6 with Yandex SDK integration,</text>
    <text x="3" y="224" font-family="Verdana,Segoe UI,sans-serif" font-size="22" fill="#173a55">cloud progress, localization, ads and release-oriented tooling.</text>

    <g transform="translate(0 266)">
      <rect width="176" height="46" rx="23" fill="url(#panel)"/>
      <text x="88" y="30" text-anchor="middle" font-family="Verdana,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#fff">WebAssembly</text>
    </g>
    <g transform="translate(190 266)">
      <rect width="164" height="46" rx="23" fill="url(#panel)"/>
      <text x="82" y="30" text-anchor="middle" font-family="Verdana,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#fff">Yandex SDK</text>
    </g>
    <g transform="translate(368 266)">
      <rect width="142" height="46" rx="23" fill="url(#panel)"/>
      <text x="71" y="30" text-anchor="middle" font-family="Verdana,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#fff">RU · EN</text>
    </g>
    <g transform="translate(524 266)">
      <rect width="198" height="46" rx="23" fill="url(#panel)"/>
      <text x="99" y="30" text-anchor="middle" font-family="Verdana,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#fff">Desktop Web</text>
    </g>
  </g>
</svg>
